version: 1
project: SignalReach AI
created_at: "2026-05-09"
description: >
  Phase 0 benchmark queries for evaluating AI-native people search quality.
  The dataset covers B2B outbound, creator sourcing, recruiting, and expert discovery.

queries:
  - id: b2b_001
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by outbound research and RevOps/Sales Ops lead quality discussions."
    target_user:
      role: founder
      company_stage: seed_to_series_b
      goal: book_sales_calls
    raw_query: >
      Find US-based B2B SaaS companies with RevOps or Sales Ops leaders,
      company size 50-500, that have been hiring sales roles recently and may use
      Salesforce or HubSpot.
    parsed_criteria:
      target_roles:
        - RevOps
        - Revenue Operations
        - Sales Operations
      industries:
        - B2B SaaS
      locations:
        - United States
      company_size:
        min: 50
        max: 500
      signals:
        - recent sales hiring
        - uses Salesforce or HubSpot
        - revenue team growth
    must_have:
      - person has a current RevOps, Revenue Operations, Sales Operations, or closely related leadership role
      - company is a B2B software or SaaS company
      - company is plausibly between 50 and 500 employees
      - at least one verifiable public source exists for role and company
    nice_to_have:
      - recent sales or go-to-market hiring signal
      - public evidence of Salesforce, HubSpot, or CRM usage
      - active LinkedIn profile or personal website
    disqualifiers:
      - consultants without an operating company role
      - companies smaller than 20 employees
      - people whose role evidence is older than 24 months
    required_evidence:
      - profile_url
      - company_url
      - role_evidence
      - company_segment_evidence
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.3

  - id: b2b_002
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by discussions about tracking funding, hiring, job changes, and warm buying signals."
    target_user:
      role: founder
      company_stage: early_stage
      goal: sell_sales_analytics_or_pipeline_tool
    raw_query: >
      Find heads of sales or sales leaders at recently funded B2B SaaS startups
      in North America that are expanding their go-to-market team.
    parsed_criteria:
      target_roles:
        - Head of Sales
        - VP Sales
        - Director of Sales
        - Chief Revenue Officer
      industries:
        - B2B SaaS
      locations:
        - United States
        - Canada
      company_stage:
        - seed
        - series_a
        - series_b
      signals:
        - recent funding
        - sales hiring
        - team expansion
    must_have:
      - person has a current sales leadership role
      - company is a B2B SaaS startup
      - public signal of recent funding or go-to-market team expansion exists
      - source evidence supports the person's current role
    nice_to_have:
      - company has open sales roles
      - founder or sales leader posts about growth or pipeline
      - contactable through LinkedIn, email, or company contact page
    disqualifiers:
      - agencies
      - consultants
      - companies without a clear software product
    required_evidence:
      - profile_url
      - company_url
      - funding_or_hiring_signal
      - role_evidence
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.25

  - id: b2b_003
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by users trying to identify buyer pain points for cold outreach."
    target_user:
      role: agency_owner
      company_stage: small_business
      goal: sell_website_or_ads_services
    raw_query: >
      Find owners or marketing decision makers at local service businesses in the
      US that appear to have outdated websites, weak local SEO, or active paid ads
      but poor landing pages.
    parsed_criteria:
      target_roles:
        - Owner
        - Founder
        - Marketing Director
        - General Manager
      industries:
        - local services
        - home services
        - clinics
        - professional services
      locations:
        - United States
      signals:
        - outdated website
        - poor local SEO
        - active paid ads
        - weak landing pages
    must_have:
      - business is a local service business
      - person is likely a decision maker
      - public business website or listing exists
      - at least one evidence-backed improvement opportunity exists
    nice_to_have:
      - visible advertising activity
      - poor mobile website experience
      - Google Business Profile exists
    disqualifiers:
      - franchises with centralized marketing
      - businesses without any identifiable decision maker
      - businesses outside the US
    required_evidence:
      - business_url
      - profile_or_contact_url
      - pain_point_evidence
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.4

  - id: b2b_004
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by lead data service providers focusing on ICP-targeted leads instead of spray-and-pray lists."
    target_user:
      role: lead_generation_consultant
      company_stage: solo_or_small_agency
      goal: sell_lead_research_services
    raw_query: >
      Find B2B service companies that sell to startups or SMBs and likely need
      better outbound lead research because their current positioning is broad
      or their target ICP is unclear.
    parsed_criteria:
      target_roles:
        - Founder
        - CEO
        - Growth Lead
        - Sales Lead
      industries:
        - B2B services
        - marketing agencies
        - software agencies
        - sales agencies
      company_size:
        min: 2
        max: 50
      signals:
        - broad positioning
        - unclear ICP
        - outbound or lead generation mentioned publicly
    must_have:
      - company sells a B2B service
      - decision maker can be identified
      - public messaging suggests broad or unclear target customer
      - evidence supports the outreach angle
    nice_to_have:
      - founder posts about client acquisition
      - website has vague audience definition
      - company publishes cold outreach or growth content
    disqualifiers:
      - pure consumer businesses
      - companies with mature sales operations teams
      - no public website
    required_evidence:
      - company_url
      - decision_maker_profile
      - positioning_or_outbound_signal
    success_criteria:
      min_relevant_people: 8
      min_average_relevance: 2
      min_contactable_ratio: 0.35

  - id: b2b_005
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by community discussions about lead quality in insurance and trigger-based lead generation."
    target_user:
      role: insurance_agent
      company_stage: independent_or_small_agency
      goal: find_high_intent_commercial_insurance_leads
    raw_query: >
      Find owners or operations leaders at small construction and contractor
      businesses in Texas that may need commercial insurance, especially those
      showing growth, hiring, new projects, or license activity.
    parsed_criteria:
      target_roles:
        - Owner
        - Founder
        - Operations Manager
        - General Manager
      industries:
        - construction
        - contractors
        - trades
      locations:
        - Texas
      signals:
        - hiring
        - new projects
        - license or permit activity
        - business expansion
    must_have:
      - business is a contractor or construction-related company
      - likely decision maker is identifiable
      - company is located in Texas
      - at least one public growth or activity signal exists
    nice_to_have:
      - commercial vehicle or workers compensation relevance
      - public phone or email
      - recent job posts or project announcements
    disqualifiers:
      - national franchises without local decision makers
      - inactive businesses
      - residential-only hobby operations
    required_evidence:
      - business_url_or_listing
      - decision_maker_source
      - growth_or_activity_signal
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.4

  - id: b2b_006
    scenario: b2b_outbound
