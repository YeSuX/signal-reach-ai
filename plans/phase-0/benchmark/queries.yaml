    target_user:
      role: founder
      company_stage: early_stage
      goal: sell_customer_support_ai_tool
    raw_query: >
      Find customer support or operations leaders at B2B SaaS companies that are
      publicly hiring support roles, mentioning ticket volume, or discussing
      customer response time problems.
    parsed_criteria:
      target_roles:
        - Head of Support
        - Customer Support Manager
        - VP Customer Success
        - Operations Lead
      industries:
        - B2B SaaS
      signals:
        - support hiring
        - ticket volume
        - response time issues
        - customer success scaling
    must_have:
      - person has customer support, customer success, or operations responsibility
      - company is a B2B software company
      - public signal suggests support scaling pressure
      - source evidence supports the signal
    nice_to_have:
      - company uses Zendesk, Intercom, Help Scout, or similar
      - recent product growth or funding
      - public LinkedIn activity from support leader
    disqualifiers:
      - consumer-only companies
      - no identifiable support or CS owner
      - stale role evidence
    required_evidence:
      - profile_url
      - company_url
      - support_scaling_signal
    success_criteria:
      min_relevant_people: 8
      min_average_relevance: 2
      min_contactable_ratio: 0.3

