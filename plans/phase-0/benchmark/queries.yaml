  - id: b2b_009
    scenario: b2b_outbound
    source: public_community_research
    source_notes:
      - "Inspired by HN discussion about niche B2B founders looking for role-based buyers."
    target_user:
      role: technical_founder
      company_stage: bootstrapped
      goal: sell_risk_forecasting_or_research_software
    raw_query: >
      Find Chief Risk Officers, risk analysts, or research directors at government
      agencies, think tanks, and large enterprises who work on crowd forecasting,
      geopolitical risk, or strategic risk analysis.
    parsed_criteria:
      target_roles:
        - Chief Risk Officer
        - Risk Analyst
        - Research Director
        - Strategic Risk Lead
        - Forecasting Lead
      industries:
        - government
        - think tanks
        - enterprise risk
        - research institutions
      signals:
        - crowd forecasting
        - geopolitical risk
        - strategic risk
        - prediction markets
    must_have:
      - person works in risk, forecasting, or research leadership
      - organization has relevance to government, policy, enterprise risk, or research
      - public evidence links person to relevant domain
    nice_to_have:
      - publications, talks, or reports on forecasting
      - public email or institutional contact page
      - active professional profile
    disqualifiers:
      - financial advisors focused only on retail investing
      - academic profiles with no applied risk relevance
      - no evidence of current role
    required_evidence:
      - profile_url
      - organization_url
      - domain_relevance_evidence
    success_criteria:
      min_relevant_people: 6
      min_average_relevance: 2
      min_contactable_ratio: 0.25

