  - id: creator_001
    scenario: creator_sourcing
    source: product_prd
    source_notes:
      - "Core SignalReach use case from original PRD."
    target_user:
      role: creator_marketing_manager
      company_stage: startup
      goal: find_ai_productivity_creators
    raw_query: >
      Find English-speaking TikTok and YouTube creators focused on AI productivity,
      workflow automation, or founder productivity, with roughly 50k-500k followers
      and signs of recent brand collaborations.
    parsed_criteria:
      creator_platforms:
        - TikTok
        - YouTube
      topics:
        - AI productivity
        - workflow automation
        - founder productivity
      audience:
        - founders
        - operators
        - knowledge workers
      follower_range:
        min: 50000
        max: 500000
      signals:
        - recent brand collaborations
        - consistent posting
    must_have:
      - creator publishes in English
      - content is primarily about AI productivity, automation, or work tools
      - public creator profile exists
      - audience appears relevant to professional or founder use cases
    nice_to_have:
      - recent sponsored content
      - newsletter or personal website
      - public business email
    disqualifiers:
      - pure entertainment creators
      - creators with mostly consumer gadget content
      - inactive for more than 6 months
    required_evidence:
      - creator_profile_url
      - content_topic_evidence
      - audience_or_collaboration_signal
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.35

  - id: creator_002
    scenario: creator_sourcing
    source: public_community_research
    source_notes:
      - "Designed to test niche B2B creator sourcing."
    target_user:
      role: b2b_marketer
      company_stage: seed_to_series_a
      goal: find_linkedin_b2b_saas_creators
    raw_query: >
      Find LinkedIn creators who write about B2B SaaS growth, outbound sales,
      founder-led sales, or GTM strategy and have an audience of startup founders
      or sales leaders.
    parsed_criteria:
      creator_platforms:
        - LinkedIn
      topics:
        - B2B SaaS growth
        - outbound sales
        - founder-led sales
        - GTM strategy
      audience:
        - startup founders
        - sales leaders
        - growth teams
    must_have:
      - creator regularly posts on LinkedIn
      - content focuses on B2B SaaS sales, growth, or GTM
      - audience relevance can be inferred from content, comments, or profile
    nice_to_have:
      - newsletter, podcast, course, or community
      - prior sponsored or partner content
      - public email or website
    disqualifiers:
      - generic motivational creators
      - enterprise consultants with no creator activity
      - mostly consumer marketing content
    required_evidence:
      - creator_profile_url
      - content_evidence
      - audience_relevance_evidence
    success_criteria:
      min_relevant_people: 10
      min_average_relevance: 2
      min_contactable_ratio: 0.3

